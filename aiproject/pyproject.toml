[project]
name = "education-service-api"
version = "0.1.0"
description = "粤教教育服务 FastAPI 后端"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.32.0,<1",
    "sqlalchemy>=2.0.36,<3",
    "pymysql>=1.1.1,<2",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.6.0,<3",
    "PyJWT>=2.15.1,<3",
    "pwdlib[argon2]>=0.3.1,<1",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27.0", "httpx2>=2.16,<3", "pytest>=8.0.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "scripts*", "docs*"]
