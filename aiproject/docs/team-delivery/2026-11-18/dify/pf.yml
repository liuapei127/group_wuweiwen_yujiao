            结论：填写规则核对里的结论。

            跟进建议：读者是负责此客户的顾问。用内部工作指令说明顾问接下来应核实什么、收集什么资料、关注什么风险，以及核实后如何推进。以“建议顾问……”或“请先核实……”等表述开头，结合客户的实际情况给出可执行步骤。客户姓名只作为被跟进的对象，不在本段称呼客户或直接向客户提问。

            沟通话术：听众是客户。站在顾问的立场，用顾问可以直接对客户说的口吻交流，使用合适的客户称呼以及“您”“我们”。说明已知情况、适合的方向及需要向客户核实的问题，表达自然简洁。本段只写可直接说给客户的话。

            待补充资料：列出当前客户确实缺少的资料，已经提供的信息不重复索要。

            两段的沟通对象必须分别保持一致。跟进建议不能照抄沟通话术。

            只使用已有记录和检索条款支持的事实。禁止编造客户的经历、条件、政策、服务、费用、录取承诺或评估结果。规则核对里的内部参考用语需要按上述沟通对象重新组织。

