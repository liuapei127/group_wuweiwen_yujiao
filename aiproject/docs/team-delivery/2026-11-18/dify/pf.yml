    - data:
        code: "import json\nimport re\n\nSINGAPORE = \"新加坡定向培养\"\nGERMANY = \"德国双元制\"\
          \n\n_EDU_LEVELS = (\n    (\"本科\", (\"本科\", \"大学毕业\")),\n    (\"专科\", (\"\
          专科\", \"大专\")),\n    (\"高中\", (\"高中\", \"高二\", \"高三\", \"中职\", \"中专\", \"\
          职高\", \"技校\", \"中技\")),\n    (\"初中\", (\"初中\", \"初一\", \"初二\", \"初三\")),\n\
          )\n\n\ndef judge_text(raw: str) -> dict:\n    \"\"\"返回可写入 customer_profile\
          \ 的字段，以及解析结果。\"\"\"\n    text = (raw or \"\").strip()\n    if not text:\n\
          \        raise ValueError(\"empty\")\n\n    fields = _extract(text)\n  \
          \  singapore = _score_singapore(fields, text)\n    germany = _score_germany(fields,\
          \ text)\n    decision = _decide(fields, text, singapore, germany)\n    background\
          \ = {key: value for key, value in fields.items() if value not in (None,\
          \ \"\", {}, [])}\n    return {\n        \"customer_name\": fields.get(\"\
          name\"),\n        \"contact_info\": fields.get(\"contact_info\"),\n    \
          \    \"background_info\": background,\n        \"match_result\": decision[\"\
          match_result\"],\n        \"matched_product\": decision[\"matched_product\"\
          ],\n        \"match_score\": decision[\"match_score\"],\n        \"match_reason\"\
          : decision[\"match_reason\"],\n        \"recommended_programs\": decision[\"\
          recommended_programs\"],\n        \"parse_result\": {\n            **background,\n\
          \            \"missing_fields\": decision[\"missing_fields\"],\n       \
          \     \"gaps\": decision[\"gaps\"],\n            \"next_stage\": decision[\"\
          next_stage\"],\n            \"next_stage_reached\": decision[\"next_stage_reached\"\
          ],\n        },\n    }\n\n\ndef _extract(text: str) -> dict:\n    payload\
          \ = _json_object(text)\n    fields = {\n        \"name\": _pick(payload,\
          \ \"name\", \"customer_name\") or _regex_group(text, r\"姓名[:：]\\s*(\\S+)\"\
          ),\n        \"contact_info\": _pick(payload, \"contact_info\", \"phone\"\
          ) or _regex(text, r\"1[3-9]\\d{9}\"),\n        \"age\": _age(payload, text),\n\
          \        \"education\": _education(payload, text),\n        \"language_ability\"\
          : _pick(payload, \"language_ability\") or _language(text),\n        \"core_demand\"\
          : _pick(payload, \"core_demand\") or _demand(text),\n        \"annual_income_range\"\
          : _pick(payload, \"annual_income_range\") or _regex(\n            text,\
          \ r\"\\d+\\s*[-~到至]\\s*\\d+\\s*万|\\d+\\s*万以上\"\n        ),\n        \"target_project\"\
          : _pick(payload, \"target_project\"),\n        \"gender\": _pick(payload,\
          \ \"gender\"),\n        \"location\": _pick(payload, \"location\"),\n  \
          \      \"profile_summary\": _pick(payload, \"profile_summary\"),\n     \
          \   \"tag_weight\": _tag_payload(payload),\n    }\n    return fields\n\n\
          \ndef _tag_payload(payload: dict) -> dict:\n    raw = payload.get(\"tag_weight\"\
          )\n    if isinstance(raw, dict):\n        return raw\n    if isinstance(raw,\
          \ str) and raw.strip().startswith(\"{\"):\n        try:\n            parsed\
          \ = json.loads(raw)\n        except json.JSONDecodeError:\n            return\
          \ {}\n        return parsed if isinstance(parsed, dict) else {}\n    return\
          \ {}\n\n\ndef _json_object(text: str) -> dict:\n    stripped = text.strip()\n\
          \    try:\n        value = json.loads(stripped)\n    except json.JSONDecodeError:\n\
          \        value = None\n    if isinstance(value, list):\n        objects\
          \ = [item for item in value if isinstance(item, dict)]\n        if len(objects)\
          \ > 1:\n            raise ValueError(\"multiple\")\n        return objects[0]\
          \ if objects else {}\n    if isinstance(value, dict):\n        return value\n\
          \    start = text.find(\"{\")\n    end = text.rfind(\"}\")\n    if start\
          \ < 0 or end <= start:\n        return {}\n    try:\n        embedded =\
          \ json.loads(text[start : end + 1])\n    except json.JSONDecodeError:\n\
          \        return {}\n    return embedded if isinstance(embedded, dict) else\
          \ {}\n\n\ndef _pick(payload: dict, *keys: str) -> str | None:\n    for key\
          \ in keys:\n        value = payload.get(key)\n        if value is None or\
          \ isinstance(value, (dict, list)):\n            continue\n        text =\
          \ str(value).strip()\n        if text:\n            return text\n    return\
          \ None\n\n\ndef _regex(text: str, pattern: str) -> str | None:\n    found\
          \ = re.search(pattern, text)\n    return found.group(0) if found else None\n\
          \n\ndef _regex_group(text: str, pattern: str) -> str | None:\n    found\
          \ = re.search(pattern, text)\n    return found.group(1) if found else None\n\
          \n\ndef _age(payload: dict, text: str) -> int | None:\n    value = payload.get(\"\
          age\")\n    if isinstance(value, int):\n        return value\n    if isinstance(value,\
          \ str) and value.isdigit():\n        return int(value)\n    found = re.search(r\"\
          (\\d{1,2})\\s*岁\", text)\n    if found:\n        return int(found.group(1))\n\
          \    return None\n\n\ndef _education(payload: dict, text: str) -> str |\
          \ None:\n    stated = _pick(payload, \"education\", \"education_level\"\
          )\n    haystack = f\"{stated or ''} {text}\"\n    for _label, words in _EDU_LEVELS:\n\
          \        if any(word in haystack for word in words):\n            return\
          \ stated or next(word for word in words if word in haystack)\n    return\
          \ stated\n\n\ndef _language(text: str) -> str | None:\n    for word in (\"\
          德语\", \"雅思\", \"英语\", \"语言\"):\n        if word in text:\n            return\
          \ word\n    return None\n\n\ndef _demand(text: str) -> str | None:\n   \
          \ hits = [word for word in (\"升学\", \"就业\", \"留学\", \"移民\", \"专升本\", \"\
          本升硕\", \"深造\") if word in text]\n    return \"、\".join(hits) or None\n\n\
          \ndef _tags(fields: dict) -> dict:\n    raw = fields.get(\"tag_weight\"\
          ) or {}\n    parsed = {}\n    for key, value in raw.items():\n        try:\n\
          \            parsed[str(key)] = float(value)\n        except (TypeError,\
          \ ValueError):\n            continue\n    return parsed\n\n\ndef _tag_points(tags:\
          \ dict, keys: tuple[str, ...], full: int, ceiling: int | None = None) ->\
          \ int:\n    best = 0\n    for key in keys:\n        if key in tags:\n  \
          \          best = max(best, int(round(tags[key] * full)))\n    if ceiling\
          \ is not None:\n        best = min(best, ceiling)\n    return best\n\n\n\
          def _income_low(fields: dict) -> int | None:\n    raw = fields.get(\"annual_income_range\"\
          ) or \"\"\n    above = re.search(r\"(\\d+)\\s*万以上\", raw)\n    if above:\n\
          \        return int(above.group(1))\n    span = re.search(r\"(\\d+)\\s*[-~到至]\\\
          s*(\\d+)\\s*万\", raw)\n    if span:\n        return int(span.group(1))\n\
          \    return None\n\n\ndef _age_fit(age: int | None, low: int, high: int)\
          \ -> str:\n    if not isinstance(age, int):\n        return \"missing\"\n\
          \    if low <= age <= high:\n        return \"exact\"\n    if 0 < low -\
          \ age <= 2 or 0 < age - high <= 2:\n        return \"near\"\n    return\
          \ \"off\"\n\n\ndef _has_any(text: str, words: tuple[str, ...]) -> bool:\n\
          \    return any(word in text for word in words)\n\n\ndef _score_singapore(fields:\
          \ dict, text: str) -> dict:\n    education = fields.get(\"education\") or\
          \ \"\"\n    age = fields.get(\"age\")\n    demand = _motive_text(fields,\
          \ text)\n    target = fields.get(\"target_project\") or \"\"\n    tags =\
          \ _tags(fields)\n    is_bachelor = \"本科\" in education\n    is_college =\
          \ (not is_bachelor) and _has_any(education, (\"专科\", \"大专\"))\n    is_junior\
          \ = _has_any(education, (\"初中\", \"初一\", \"初二\", \"初三\"))\n    is_senior\
          \ = _has_any(education, (\"高中\", \"高二\", \"高三\", \"中职\", \"中专\", \"职高\"\
          , \"技校\", \"中技\"))\n    is_vocational = _has_any(education, (\"职高\", \"\
          中专\", \"中职\", \"技校\", \"中技\"))\n    wants_job = \"就业\" in demand or _has_any(target,\
          \ (\"酒店\", \"航空\", \"6+6\", \"9+6\"))\n\n    candidates = []\n    if is_junior:\n\
          \        candidates.append(_sg_age_band(age, 14, 16, \"升学\", [\"2+2新加坡定向培养本科班\"\
          , \"2+2+1本硕连读\"], \"初中、14到16岁\"))\n    if is_senior and not is_college and\
          \ not is_bachelor:\n        candidates.append(_sg_age_band(age, 16, 19,\
          \ \"升学\", [\"0.5/1+2新加坡定向培养本科班\", \"0.5/1+2+1本硕连读\"], \"高中或同等学历、16到19岁\"\
          ))\n    if is_vocational or (wants_job and (is_vocational or is_college\
          \ or is_senior)):\n        candidates.append(_sg_job_band(age, is_vocational,\
          \ [\"6+6酒店运营大专就业班\", \"9+6航空运营大专就业班\"]))\n    if is_college:\n        candidates.append({\"\
          band\": 40, \"needs_age\": False, \"kind\": \"升学\", \"programs\": [\"新加坡一年制专升本\"\
          ], \"label\": \"专科学历对应一年制专升本\"})\n    if is_bachelor:\n        candidates.append({\"\
          band\": 40, \"needs_age\": False, \"kind\": \"升学\", \"programs\": [\"新加坡一年制本升硕\"\
          ], \"label\": \"本科学历对应一年制本升硕\"})\n\n    parts: list[tuple[str, int]] = []\n\
          \    programs: list[str] = []\n    needs_age = False\n    kind = None\n\
          \    band = 0\n    if candidates:\n        for item in candidates:\n   \
          \         item[\"demand\"] = _demand_points(demand, item[\"kind\"])\n  \
          \          item[\"named\"] = _target_hits(target, item[\"programs\"])\n\
          \            item[\"rank\"] = item[\"band\"] + item[\"demand\"] + (12 if\
          \ item[\"named\"] else 0)\n        named = [item for item in candidates\
          \ if item[\"named\"]]\n        chosen = max(named or candidates, key=lambda\
          \ item: item[\"rank\"])\n        if chosen[\"named\"]:\n            programs\
          \ = [program for program in chosen[\"programs\"] if _target_hits(target,\
          \ [program])] or list(chosen[\"programs\"])\n        else:\n           \
          \ programs = list(chosen[\"programs\"])\n        parts.append((chosen[\"\
          label\"], chosen[\"band\"]))\n        if chosen[\"demand\"]:\n         \
          \   parts.append((_demand_note(demand, chosen[\"kind\"]), chosen[\"demand\"\
          ]))\n        needs_age = chosen[\"needs_age\"]\n        kind = chosen[\"\
          kind\"]\n        band = chosen[\"band\"]\n\n    income_points, income_note\
          \ = _sg_income(_income_low(fields), \"就业\" if programs and _has_any(\" \"\
          .join(programs), (\"酒店\", \"航空\")) else \"升学\")\n    if income_points:\n\
          \        parts.append((income_note, income_points))\n    language_points,\
          \ language_note = _sg_language(text, tags)\n    if language_points:\n  \
          \      parts.append((language_note, language_points))\n    intent = max(_tag_points(tags,\
          \ (\"留学意愿\",), 10), 8 if _has_any(text, (\"新加坡\", \"留学\")) else 0)\n   \
          \ if intent:\n        parts.append((\"有留学或新加坡意向\", intent))\n    if programs\
          \ and _target_hits(target, programs):\n        parts.append((\"资料点名了这个项目\"\
          , 5))\n\n    score = min(sum(points for _note, points in parts), 100)\n\
          \    return {\n        \"score\": score,\n        \"programs\": _unique(programs),\n\
          \        \"parts\": parts,\n        \"needs_age\": needs_age,\n        \"\
          kind\": kind,\n        \"band\": band,\n    }\n\n\ndef _sg_age_band(age:\
          \ int | None, low: int, high: int, kind: str, programs: list[str], label:\
          \ str) -> dict:\n    fit = _age_fit(age, low, high)\n    points = {\"exact\"\
          : 40, \"near\": 24, \"missing\": 16, \"off\": 8}[fit]\n    note = label\
          \ if fit == \"exact\" else f\"{label}，年龄{'缺失' if fit == 'missing' else '只是接近'\
          \ if fit == 'near' else '偏离档位'}\"\n    return {\"band\": points, \"needs_age\"\
          : fit != \"exact\", \"kind\": kind, \"programs\": programs, \"label\": note}\n\
          \n\ndef _sg_job_band(age: int | None, vocational: bool, programs: list[str])\
          \ -> dict:\n    fit = _age_fit(age, 17, 45)\n    if vocational and fit ==\
          \ \"exact\":\n        points, needs_age, note = 40, False, \"职高或中职、年满17岁，对应就业班\"\
          \n    elif vocational and fit == \"near\":\n        points, needs_age, note\
          \ = 24, True, \"职高或中职，年龄接近17岁\"\n    elif fit == \"exact\":\n        points,\
          \ needs_age, note = 28, False, \"年满17岁且指向就业班，学历不是职高原档\"\n    else:\n   \
          \     points, needs_age, note = 12, fit != \"exact\", \"就业班只对上一部分条件\"\n\
          \    return {\"band\": points, \"needs_age\": needs_age, \"kind\": \"就业\"\
          , \"programs\": programs, \"label\": note}\n\n\ndef _motive_text(fields:\
          \ dict, text: str) -> str:\n    stated = \" \".join(\n        part for part\
          \ in (fields.get(\"core_demand\"), fields.get(\"target_project\")) if part\n\
          \    )\n    return stated or text\n\n\ndef _motives(demand: str) -> set[str]:\n\
          \    \"\"\"把客户自己的说法归到规则里的升学、就业、移民。没写到的不补。\"\"\"\n    found: set[str] = set()\n\
          \    if _has_any(demand, (\"升学\", \"学历\", \"留学\", \"深造\", \"本科\", \"硕士\"\
