      position:
        x: 1500
        y: 700
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "\"\"\"Pure contracts shared by Dify sandbox nodes and local regression\
          \ tests.\"\"\"\nimport json\nimport re\nfrom urllib.parse import urlencode\n\
          \nACTIONS = {\n 'lead_create': ('post','/api/v1/consultant/leads','customer_name','customer_name\
