    - data:
        code: "import re\nfrom urllib.parse import quote\n\ndef main(user_query: str\
          \ = '') -> dict:\n    q = (user_query or '').strip()\n    booking = bool(re.search(r'我要报名|我想报名|确认报名|帮我报名|我想预约|帮我预约|^报名$',\
          \ q))\n    return {'query_params': 'query=' + quote(q), 'need_direct': 'yes'\
          \ if booking else 'no', 'direct_reply': '请登录官网，在活动预约中选择场次，或在登录后的客服里选择场次并确认报名。'}\n"
