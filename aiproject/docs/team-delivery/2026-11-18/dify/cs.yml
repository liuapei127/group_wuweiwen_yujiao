    nodes:
    - data:
        title: 开始
        type: start
        variables: []
      height: 72
      id: '1711528914102'
      position:
        x: 40
        y: 520
      positionAbsolute:
        x: 40
        y: 520
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    - data:
        code: "import re\n\ndef main(user_query: str = \"\") -> dict:\n    q = (user_query\
          \ or \"\").strip()\n    force_branch = \"\"\n    empathy = \"no\"\n    if\
          \ re.search(r\"累|难过|焦虑|安慰|崩溃|烦死了|好丧\", q):\n        empathy = \"yes\"\n\
          \    has_event = bool(re.search(r\"活动|宣讲|讲座|说明会|宣讲会\", q))\n    list_only\
          \ = bool(re.search(r\"有哪些|有什么|几场|列表|查询|可以报名\", q)) and not re.search(\n\
          \        r\"我想报名|我要报名|帮我报名|确认报名\", q\n    )\n    if has_event and not list_only\
          \ and (\n        empathy == \"yes\" or re.search(r\"最近.*(活动|讲座)\", q)\n\
          \    ):\n        force_branch = \"event_register\"\n    if re.search(r\"\
          报名材料|交完资料|交了下一步|资料后还要\", q):\n        force_branch = \"faq\"\n    elif re.search(r\"\
          德国双元制|双元制怎么学\", q) and \"推荐\" not in q:\n        force_branch = \"business_query\"\
          \n    return {\"force_branch\": force_branch, \"empathy_hint\": empathy}\n"
        code_language: python3
        outputs:
          empathy_hint:
            children: null
            type: string
          force_branch:
            children: null
            type: string
        title: query_preprocess
        type: code
        variables:
        - value_selector:
          - sys
          - query
          value_type: string
          variable: user_query
      height: 51
      id: cs1700000050
      position:
        x: 240
        y: 520
      positionAbsolute:
        x: 240
        y: 520
