        - id: casual_chat
          name: 日常闲聊（问候/情绪/吐槽/与留学无关的唠嗑，非业务问答）
        instruction: 每条用户消息只选一个最贴切场景。纯问候、情绪倾诉、与业务无关的唠嗑选「日常闲聊」；带具体留学/公司/政策/费用/活动/报名意图的勿选闲聊。
