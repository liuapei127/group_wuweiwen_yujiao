    - data:
        code: "import json\n\ndef main(text: str, query: str) -> dict:\n    try:\n\
          \        raw=(text or \"\").strip()\n        if raw.startswith(chr(96)*3):\
          \ raw=raw.split(\"\\n\",1)[-1].rsplit(chr(96)*3,1)[0]\n        obj=json.loads(raw)\n\
          \        intents={\"leave_create\",\"leave_query\",\"feedback\",\"progress\"\
          ,\"deadline\",\"ask\",\"profile\",\"location\",\"chat\",\"support\",\"cancel\"\
          ,\"confirm\"}\n        assert isinstance(obj,dict) and obj.get(\"intent\"\
          ) in intents\n        fields=obj.get(\"fields\") or {}\n        fields={k:v[:4000]\
          \ for k,v in fields.items() if k in (\"reason\",\"content\") and isinstance(v,str)}\n\
          \        clean={\"intent\":obj[\"intent\"],\"fields\":fields,\"reply\":str(obj.get(\"\
          reply\") or \"\")[:3000],\"search_query\":str(obj.get(\"search_query\")\
          \ or \"\")[:500],\"evidence_ids\":[]}\n    except Exception:\n        clean={\"\
          intent\":\"chat\",\"fields\":{},\"reply\":\"\",\"search_query\":\"\",\"\
          evidence_ids\":[]}\n    mode=\"knowledge\" if clean[\"intent\"]==\"ask\"\
          \ else \"companion\" if clean[\"intent\"] in (\"support\",\"chat\") else\
          \ \"service\"\n    return {\"raw_json\":json.dumps(clean,ensure_ascii=False),\"\
          mode\":mode,\"search_query\":clean[\"search_query\"] or query}\n"
        code_language: python3
        desc: ''
        outputs:
          mode:
            children: null
            type: string
          raw_json:
            children: null
            type: string
          search_query:
            children: null
            type: string
