        title: 后端探活（短超时，不重试）
        type: http-request
        url: http://host.docker.internal:8003/health
        variables: []
      height: 90
      id: health
      position:
        x: 300
        y: 300
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "import json,re\n\ndef main(query: str, status_code: int, body: str):\n\
          \    try:healthy=int(status_code)==200 and json.loads(body).get('status')=='ok'\n\
          \    except Exception:healthy=False\n    if not healthy:return {'needs_llm':False,'reply':'ENT_BACKEND_UNAVAILABLE'}\n\
          \    if re.search(r'健康检查|后端.*正常|探活|health',query,re.I):\n        return\
          \ {'needs_llm':False,'reply':'后端探活成功，员工权限和业务结果由工作台核验。'}\n    if re.search(r'什么是.*503|503.*什么意思',query):\n\
          \        return {'needs_llm':False,'reply':'HTTP 503表示服务暂不可用；本项目也用于员工可信身份未就绪。不能据此声称保存成功。'}\n\
          \    return {'needs_llm':True,'reply':''}"
        code_language: python3
        outputs:
          needs_llm:
            children: null
            type: boolean
          reply:
            children: null
            type: string
        title: 核对实际健康响应
        type: code
        variables:
        - value_selector:
          - sys
          - query
          value_type: string
          variable: query
        - value_selector:
          - health
          - status_code
          value_type: number
          variable: status_code
        - value_selector:
          - health
          - body
          value_type: string
          variable: body
