    - data:
        code: "\"\"\"Pure contracts shared by Dify sandbox nodes and local regression\
          \ tests.\"\"\"\nimport json\nimport re\nfrom urllib.parse import urlencode\n\
          \nACTIONS = {\n 'lead_create': ('post','/api/v1/consultant/leads','customer_name','customer_name\
          \ contact_info gender age education_level intended_country intended_major\
          \ background_info source_channel remark'),\n 'lead_list': ('get','/api/v1/consultant/leads','','keyword\
          \ status page page_size'),\n 'lead_detail': ('get','/api/v1/consultant/leads/{lead_id}','lead_id','lead_id\
          \ customer_name'),\n 'lead_update': ('patch','/api/v1/consultant/leads/{lead_id}','lead_id','lead_id\
