          \ out\n            params[k]=int(params[k])\n    if intent=='nl_query':\n\
          \        if params['intent'] not in ('leads_by_status','lead_detail_by_name','lead_follow_ups_by_name','pending_leaves','daily_reports_recent')\
          \ or not isinstance(params['params'],dict):\n            out['reply']='仅允许白名单查询意图，不接受SQL。';return\
