          \        out['reply']='请核对以下操作，回复“确认”才会提交；回复“取消”放弃。\\n'+intent+'\\n'+json.dumps(params,ensure_ascii=False)\n\
          \        out['pending']=json.dumps({'intent':intent,'params':params,'state':'confirm'},ensure_ascii=False);return\
          \ out\n    path_fields={k:params[k] for k in re.findall(r'\\{(\\w+)\\}',template)}\n\
