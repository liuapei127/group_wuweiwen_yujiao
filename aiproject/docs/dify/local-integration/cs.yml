        type: code
        title: 闲聊业务兜底检测
        code_language: python3
        code: "import re\n\nORDER = [\"faq\", \"event\", \"policy\", \"company\", \"recommend\", \"business\"]\n\
          RULES = {\"faq\": [\"退费\", \"费用\", \"多少钱\", \"价格\", \"定金\", \"手续\", \"流程\", \"合同\"], \"event\": [\"活动\"\
          , \"报名\", \"分享会\", \"讲座\", \"预约\", \"宣讲\"], \"policy\": [\"签证\", \"移民\", \"政策\", \"要求\", \"门槛\", \"拒签\"\
          ], \"company\": [\"公司\", \"资质\", \"校区\", \"粤教\", \"品牌\", \"办公地址\"], \"recommend\": [\"推荐\", \"适合什么\",\
          \ \"匹配\", \"我初中毕业\", \"我高中\", \"选校\"], \"business\": [\"项目\", \"课程\", \"2+2\", \"本硕\", \"新加坡\", \"德国\"\
          , \"培训\", \"留学\"]}\n\ndef main(user_query: str = \"\") -> dict:\n    q = (user_query or \"\").strip()\n\
          \    route = \"chat\"\n    if not q:\n        return {\"route\": route}\n    for key in ORDER:\n     \
          \   for p in RULES.get(key) or []:\n            if p in q:\n                route = key\n            \
          \    break\n        if route != \"chat\":\n            break\n    return {\"route\": route}\n"
        variables:
        - variable: user_query
          value_selector:
          - sys
          - query
          value_type: string
        outputs:
          route:
            type: string
            children: null
