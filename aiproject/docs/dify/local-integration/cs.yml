    - id: cs1700000004
      type: custom
      data:
        type: code
        title: 合并推荐数据
        code_language: python3
        code: "import json\n\ndef main(http_body: str, http_status: int = 200) -> dict:\n    intent_code = \"course_recommend\"\
          \n    try:\n        status = int(http_status if http_status is not None else 200)\n    except (TypeError,\
          \ ValueError):\n        status = 200\n    if status >= 400 or not (http_body or \"\").strip():\n     \
          \   return {\n            \"tool_context\": \"\",\n            \"answer_mode\": \"error\",\n         \
          \   \"intent_code\": intent_code,\n            \"crm_ok\": \"no\",\n        }\n    try:\n        payload\
          \ = json.loads(http_body or \"{}\")\n    except json.JSONDecodeError:\n        return {\n            \"\
          tool_context\": \"\",\n            \"answer_mode\": \"error\",\n            \"intent_code\": intent_code,\n\
          \            \"crm_ok\": \"no\",\n        }\n    if payload.get(\"code\") != 0:\n        return {\n  \
          \          \"tool_context\": \"\",\n            \"answer_mode\": \"error\",\n            \"intent_code\"\
          : intent_code,\n            \"crm_ok\": \"no\",\n        }\n    data = payload.get(\"data\")\n    if isinstance(data,\
          \ list) and data:\n        top = data[0]\n        lines = [\n            f\"code: {top.get('code')}\"\
          ,\n            f\"name: {top.get('name')}\",\n            f\"country: {top.get('country')}\",\n      \
          \      f\"summary: {top.get('summary') or top.get('description') or ''}\",\n            f\"target_audience:\
          \ {top.get('target_audience') or ''}\",\n            f\"price: {top.get('price')}\",\n        ]\n    \
          \    ctx = \"\\\\n\".join(lines)\n    elif isinstance(data, list):\n        ctx = \"[]\"\n    elif isinstance(data,\
          \ dict):\n        ctx = json.dumps(data, ensure_ascii=False, indent=2)\n    else:\n        ctx = str(data)\n\
          \    return {\"tool_context\": ctx, \"answer_mode\": \"tool\", \"intent_code\": intent_code, \"crm_ok\"\
          : \"yes\"}\n"
        variables:
        - variable: http_body
          value_selector:
          - cs1700000030
          - body
          value_type: string
        - variable: http_status
          value_selector:
          - cs1700000030
          - status_code
          value_type: number
        outputs:
          tool_context:
            type: string
            children: null
          answer_mode:
            type: string
            children: null
          intent_code:
            type: string
            children: null
          crm_ok:
            type: string
            children: null
