    - data:
        code: "import json\nimport re\n\ndef main(user_query: str = \"\") -> dict:\n\
          \    q = (user_query or \"\").strip() or \"升学\"\n    params = {\"core_demand\"\
          : q, \"user_query\": q}\n    if re.search(r\"高中|初中|中职|大专|本科\", q):\n   \
          \     m = re.search(r\"(高中|初中|中职|大专|本科)(毕业|在读)?\", q)\n        if m:\n \
          \           params[\"education\"] = m.group(0)\n    if \"新加坡\" in q:\n \
          \       params[\"country\"] = \"新加坡\"\n    elif \"德国\" in q:\n        params[\"\
          country\"] = \"德国\"\n    body = json.dumps({\"action\": \"profile.match\"\
          , \"params\": params}, ensure_ascii=False)\n    return {\"request_body\"\
          : body}\n"
