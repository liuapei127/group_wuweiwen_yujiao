    - data:
        code: |-
          import json
          import re

          SINGAPORE = "新加坡定向培养"
          GERMANY = "德国双元制"

          _EDU_LEVELS = (
              ("本科", ("本科", "大学毕业")),
              ("专科", ("专科", "大专")),
              ("高中", ("高中", "高二", "高三", "中职", "中专", "职高", "技校", "中技")),
              ("初中", ("初中", "初一", "初二", "初三")),
          )


          def judge_text(raw: str) -> dict:
              """返回可写入 customer_profile 的字段，以及解析结果。"""
              text = (raw or "").strip()
              if not text:
                  raise ValueError("empty")

              fields = _extract(text)
              singapore = _score_singapore(fields, text)
              germany = _score_germany(fields, text)
              decision = _decide(fields, text, singapore, germany)
              background = {key: value for key, value in fields.items() if value not in (None, "", {}, [])}
              return {
                  "customer_name": fields.get("name"),
                  "contact_info": fields.get("contact_info"),
                  "background_info": background,
                  "match_result": decision["match_result"],
                  "matched_product": decision["matched_product"],
                  "match_score": decision["match_score"],
                  "match_reason": decision["match_reason"],
                  "recommended_programs": decision["recommended_programs"],
                  "conclusion": decision["conclusion"],
                  "missing_materials": decision["missing_materials"],
                  "talk_points": decision["talk_points"],
                  "rule_brief": decision["rule_brief"],
                  "retrieval_query": decision["retrieval_query"],
                  "parse_result": {
                      **background,
                      "missing_fields": decision["missing_fields"],
                      "gaps": decision["gaps"],
                      "next_stage": decision["next_stage"],
                      "next_stage_reached": decision["next_stage_reached"],
                      "conclusion": decision["conclusion"],
                      "missing_materials": decision["missing_materials"],
                      "talk_points": decision["talk_points"],
                  },
              }


          def _extract(text: str) -> dict:
              payload = _json_object(text)
              fields = {
                  "name": _pick(payload, "name", "customer_name") or _regex_group(text, r"姓名[:：]\s*(\S+)"),
                  "contact_info": _pick(payload, "contact_info", "phone") or _regex(text, r"1[3-9]\d{9}"),
                  "age": _age(payload, text),
                  "education": _education(payload, text),
                  "language_ability": _pick(payload, "language_ability") or _language(text),
                  "core_demand": _pick(payload, "core_demand") or _demand(text),
                  "annual_income_range": _pick(payload, "annual_income_range") or _regex(
                      text, r"\d+\s*[-~到至]\s*\d+\s*万|\d+\s*万以上"
                  ),
                  "target_project": _pick(payload, "target_project") or _regex_group(text, r"目标项目[:：]\s*([^\n]+)"),
                  "gender": _pick(payload, "gender"),
                  "location": _pick(payload, "location"),
                  "profile_summary": _pick(payload, "profile_summary"),
                  "tag_weight": _tag_payload(payload),
              }
              return fields


          def _tag_payload(payload: dict) -> dict:
              raw = payload.get("tag_weight")
              if isinstance(raw, dict):
                  return raw
              if isinstance(raw, str) and raw.strip().startswith("{"):
                  try:
                      parsed = json.loads(raw)
                  except json.JSONDecodeError:
                      return {}
                  return parsed if isinstance(parsed, dict) else {}
              return {}


          def _json_object(text: str) -> dict:
              stripped = text.strip()
              try:
                  value = json.loads(stripped)
              except json.JSONDecodeError:
                  value = None
              if isinstance(value, list):
                  objects = [item for item in value if isinstance(item, dict)]
                  if len(objects) > 1:
                      raise ValueError("multiple")
                  return objects[0] if objects else {}
              if isinstance(value, dict):
                  return value
              start = text.find("{")
              end = text.rfind("}")
              if start < 0 or end <= start:
                  return {}
              try:
                  embedded = json.loads(text[start : end + 1])
              except json.JSONDecodeError:
                  return {}
              return embedded if isinstance(embedded, dict) else {}


          def _pick(payload: dict, *keys: str) -> str | None:
              for key in keys:
                  value = payload.get(key)
                  if value is None or isinstance(value, (dict, list)):
                      continue
                  text = str(value).strip()
                  if text:
                      return text
              return None


          def _regex(text: str, pattern: str) -> str | None:
              found = re.search(pattern, text)
              return found.group(0) if found else None


          def _regex_group(text: str, pattern: str) -> str | None:
              found = re.search(pattern, text)
              return found.group(1) if found else None


          def _age(payload: dict, text: str) -> int | None:
              value = payload.get("age")
              if isinstance(value, int):
                  return value
              if isinstance(value, str) and value.isdigit():
                  return int(value)
              found = re.search(r"(\d{1,2})\s*岁", text)
              if found:
                  return int(found.group(1))
              found = re.search(r"(?:年龄|age)\s*[:：]\s*(\d{1,2})\b", text, re.I)
              if found:
                  return int(found.group(1))
              return None


          def _education(payload: dict, text: str) -> str | None:
              stated = _pick(payload, "education", "education_level")
              haystack = f"{stated or ''} {text}"
              for _label, words in _EDU_LEVELS:
                  if any(word in haystack for word in words):
                      return stated or next(word for word in words if word in haystack)
              return stated


          def _language(text: str) -> str | None:
              for word in ("德语", "雅思", "英语", "语言"):
                  if word in text:
                      return word
              return None


          def _demand(text: str) -> str | None:
              hits = [word for word in ("升学", "就业", "留学", "移民", "专升本", "本升硕", "深造") if word in text]
              return "、".join(hits) or None


          def _tags(fields: dict) -> dict:
              raw = fields.get("tag_weight") or {}
              parsed = {}
              for key, value in raw.items():
                  try:
                      parsed[str(key)] = float(value)
                  except (TypeError, ValueError):
                      continue
              return parsed


          def _tag_points(tags: dict, keys: tuple[str, ...], full: int, ceiling: int | None = None) -> int:
              best = 0
              for key in keys:
                  if key in tags:
                      best = max(best, int(round(tags[key] * full)))
              if ceiling is not None:
                  best = min(best, ceiling)
              return best


          def _income_low(fields: dict) -> int | None:
              raw = fields.get("annual_income_range") or ""
              above = re.search(r"(\d+)\s*万以上", raw)
              if above:
                  return int(above.group(1))
              span = re.search(r"(\d+)\s*[-~到至]\s*(\d+)\s*万", raw)
              if span:
                  return int(span.group(1))
              return None


          def _age_fit(age: int | None, low: int, high: int) -> str:
              if not isinstance(age, int):
                  return "missing"
              if low <= age <= high:
                  return "exact"
              if 0 < low - age <= 2 or 0 < age - high <= 2:
                  return "near"
              return "off"


          def _has_any(text: str, words: tuple[str, ...]) -> bool:
              return any(word in text for word in words)


          def _score_singapore(fields: dict, text: str) -> dict:
              education = fields.get("education") or ""
              age = fields.get("age")
              demand = _motive_text(fields, text)
              target = fields.get("target_project") or ""
              tags = _tags(fields)
              is_bachelor = "本科" in education
              is_college = (not is_bachelor) and _has_any(education, ("专科", "大专"))
              is_junior = _has_any(education, ("初中", "初一", "初二", "初三"))
              is_senior = _has_any(education, ("高中", "高二", "高三", "中职", "中专", "职高", "技校", "中技"))
              is_vocational = _has_any(education, ("职高", "中专", "中职", "技校", "中技"))
              wants_job = "就业" in demand or _has_any(target, ("酒店", "航空", "6+6", "9+6"))

              candidates = []
              if is_junior:
                  candidates.append(_sg_age_band(age, 14, 16, "升学", ["2+2新加坡定向培养本科班", "2+2+1本硕连读"], "初中、14到16岁"))
              if is_senior and not is_college and not is_bachelor:
                  candidates.append(_sg_age_band(age, 16, 19, "升学", ["0.5/1+2新加坡定向培养本科班", "0.5/1+2+1本硕连读"], "高中或同等学历、16到19岁"))
              if is_vocational or (wants_job and (is_vocational or is_college or is_senior)):
                  candidates.append(_sg_job_band(age, is_vocational, ["6+6酒店运营大专就业班", "9+6航空运营大专就业班"]))
              if is_college:
                  candidates.append({"band": 40, "needs_age": False, "kind": "升学", "programs": ["新加坡一年制专升本"], "label": "专科学历对应一年制专升本"})
              if is_bachelor:
                  candidates.append({"band": 40, "needs_age": False, "kind": "升学", "programs": ["新加坡一年制本升硕"], "label": "本科学历对应一年制本升硕"})

              parts: list[tuple[str, int]] = []
              programs: list[str] = []
              needs_age = False
              kind = None
              band = 0
              if candidates:
                  for item in candidates:
                      item["demand"] = _demand_points(demand, item["kind"])
                      item["named"] = _target_hits(target, item["programs"])
                      item["rank"] = item["band"] + item["demand"] + (12 if item["named"] else 0)
                  named = [item for item in candidates if item["named"]]
                  chosen = max(named or candidates, key=lambda item: item["rank"])
                  if chosen["named"]:
                      programs = [program for program in chosen["programs"] if _target_hits(target, [program])] or list(chosen["programs"])
                  else:
                      programs = list(chosen["programs"])
                  parts.append((chosen["label"], chosen["band"]))
                  if chosen["demand"]:
                      parts.append((_demand_note(demand, chosen["kind"]), chosen["demand"]))
                  needs_age = chosen["needs_age"]
                  kind = chosen["kind"]
                  band = chosen["band"]

              income_points, income_note = _sg_income(_income_low(fields), "就业" if programs and _has_any(" ".join(programs), ("酒店", "航空")) else "升学")
              if income_points:
                  parts.append((income_note, income_points))
              language_points, language_note = _sg_language(text, tags)
              if language_points:
                  parts.append((language_note, language_points))
              intent = max(_tag_points(tags, ("留学意愿",), 10), 8 if _has_any(text, ("新加坡", "留学")) else 0)
              if intent:
                  parts.append(("有留学或新加坡意向", intent))
              if programs and _target_hits(target, programs):
                  parts.append(("资料点名了这个项目", 5))

              score = min(sum(points for _note, points in parts), 100)
              return {
                  "score": score,
                  "programs": _unique(programs),
                  "parts": parts,
                  "needs_age": needs_age,
                  "kind": kind,
                  "band": band,
              }


          def _sg_age_band(age: int | None, low: int, high: int, kind: str, programs: list[str], label: str) -> dict:
              fit = _age_fit(age, low, high)
              points = {"exact": 40, "near": 24, "missing": 16, "off": 8}[fit]
              note = label if fit == "exact" else f"{label}，年龄{'缺失' if fit == 'missing' else '只是接近' if fit == 'near' else '偏离档位'}"
              return {"band": points, "needs_age": fit != "exact", "kind": kind, "programs": programs, "label": note}


          def _sg_job_band(age: int | None, vocational: bool, programs: list[str]) -> dict:
              fit = _age_fit(age, 17, 45)
              if vocational and fit == "exact":
                  points, needs_age, note = 40, False, "职高或中职、年满17岁，对应就业班"
              elif vocational and fit == "near":
                  points, needs_age, note = 24, True, "职高或中职，年龄接近17岁"
              elif fit == "exact":
                  points, needs_age, note = 28, False, "年满17岁且指向就业班，学历不是职高原档"
              else:
                  points, needs_age, note = 12, fit != "exact", "就业班只对上一部分条件"
              return {"band": points, "needs_age": needs_age, "kind": "就业", "programs": programs, "label": note}


          def _motive_text(fields: dict, text: str) -> str:
              stated = " ".join(
                  part for part in (fields.get("core_demand"), fields.get("target_project")) if part
              )
              return stated or text


          def _motives(demand: str) -> set[str]:
              """把客户自己的说法归到规则里的升学、就业、移民。没写到的不补。"""
              found: set[str] = set()
              if _has_any(demand, ("升学", "学历", "留学", "深造", "本科", "硕士", "镀金", "国际化", "素质教育", "本硕")):
                  found.add("升学")
              if _has_any(demand, ("就业", "工作", "高薪", "晋升", "技能", "转型", "求职")):
                  found.add("就业")
              if "移民" in demand:
                  found.add("移民")
              return found


          def _demand_points(demand: str, kind: str) -> int:
              motives = _motives(demand)
              study = "升学" in motives
              job = "就业" in motives
              if kind == "升学" and study and not job:
                  return 20
              if kind == "就业" and job and not study:
                  return 20
              if study and job:
                  return 14
              if study or job:
                  return 8
              return 0


          def _demand_note(demand: str, kind: str) -> str:
              points = _demand_points(demand, kind)
              if points == 20:
                  return "升学需求对上" if kind == "升学" else "就业需求对上"
              if points == 14:
                  return "升学和就业都有，和这一档只是部分一致"
              if points == 8:
                  return "需求方向和这一档不完全一致"
              return "没有写明升学或就业需求"


          def _sg_income(low: int | None, kind: str) -> tuple[int, str]:
              if low is None:
                  return 0, ""
              if kind == "就业":
                  if low <= 30:
                      return 12, "就业方向更看重性价比，当前收入区间能覆盖"
                  return 9, "收入可以支撑就业方向"
              if low >= 30:
                  return 15, "年收入下沿达到30万，属于中等以上"
              if low >= 20:
                  return 11, "年收入下沿在20万到30万"
              if low >= 15:
                  return 8, "年收入下沿在15万到20万，学费会有压力"
              if low >= 10:
                  return 5, "年收入下沿在10万到15万，升学费用偏紧"
              return 2, "年收入下沿低于10万"


          def _sg_language(text: str, tags: dict) -> tuple[int, str]:
              if _has_any(text, ("薄弱", "基础差", "偏下", "零基础")):
                  return 3, "英语基础偏弱"
              if re.search(r"雅思\s*([6-9]|[1-9]\d)", text) or _has_any(text, ("六级", "流利", "母语")):
                  return 10, "英语达到六级、雅思6分或流利"
              if re.search(r"雅思\s*5", text) or _has_any(text, ("四级", "中等", "良好")):
                  return 7, "英语处于中等、四级或雅思5分"
              lifted = _tag_points(tags, ("英语能力", "英语优势", "语言优势"), 10)
              if lifted:
                  return lifted, "语言标签较高"
              return 0, ""


          def _target_hits(target: str, programs: list[str]) -> bool:
              if not target:
                  return False
              if "2+2+1" in target or "2 + 2 + 1" in target:
                  return any("2+2+1" in program for program in programs)
              if "0.5" in target and _has_any(target, ("2+1", "+1", "本硕")):
                  return any("0.5" in program and "2+1" in program for program in programs)
              if "0.5" in target:
                  return any("0.5" in program and "2+1" not in program for program in programs)
              if "2+2" in target or "2 + 2" in target:
                  return any("2+2" in program and "2+2+1" not in program for program in programs)
              for token in ("专升本", "本升硕", "酒店", "航空"):
                  if token in target:
                      return any(token in program for program in programs)
              return False


          def _score_germany(fields: dict, text: str) -> dict:
              education = fields.get("education") or ""
              age = fields.get("age")
              demand = _motive_text(fields, text)
              tags = _tags(fields)
              german_context = _has_any(text, ("德国", "双元", "中德", "德语"))
              parts: list[tuple[str, int]] = []
              fit = _age_fit(age, 18, 35)
              if fit == "exact":
                  parts.append(("年龄在18到35岁", 25))
              elif fit == "near":
                  parts.append(("年龄靠近18到35岁，但还在档外", 12))
              qualified = _has_any(education, ("高中", "高二", "高三", "中职", "中专", "职高", "技校", "中技", "专科", "大专", "本科"))
              if qualified:
                  parts.append(("学历达到高中及以上", 20))
              elif _has_any(education, ("初中", "初一", "初二", "初三")):
                  parts.append(("学历是初中，低于德国项目要求的高中", 4))

              motives = []
              if _has_any(demand, ("就业", "工作")):
                  motives.append("就业")
              if _has_any(demand, ("升学", "深造", "学历")):
                  motives.append("升学")
              if "移民" in demand:
                  motives.append("移民")
              if motives:
                  parts.append(("职业诉求包含" + "、".join(motives), min(8 * len(motives), 20)))

              programs = _german_programs(text) if german_context else []
              skill_tag = _tag_points(tags, ("动手能力",), 15)
              if programs:
                  parts.append(("专业方向对上德国培训目录", 15))
              elif _has_any(text, ("动手", "实践", "逻辑")) or skill_tag >= 10:
                  parts.append(("有动手或实践倾向，专业还没点名", 10))
              elif skill_tag:
                  parts.append(("动手能力标签有一些基础", skill_tag))

              language_points, language_note = _de_language(text, tags)
              if language_points:
                  parts.append((language_note, language_points))

              intent = max(
                  _tag_points(tags, ("移民意愿", "留学意愿"), 5),
                  5 if _has_any(text, ("德国", "双元", "中德")) else 0,
              )
              if intent:
                  parts.append(("有德国、双元或移民意向", intent))

              score = min(sum(points for _note, points in parts), 100)
              return {
                  "score": score,
                  "programs": programs,
                  "parts": parts,
                  "needs_age": fit != "exact",
              }


          def _german_b1_met(text: str) -> bool:
              level = r"(?:B1|B2|C1|C2|专业级)"
              for part in re.split(r"[，,。；;\n]", text):
                  for match in re.finditer(r"(?:德语|German)\s*(?:水平|等级|成绩|证书)?\s*[:：]?\s*(?:已达(?:到)?|达到|已通过|通过|已取得|取得|已获得|获得)?\s*" + level, part, re.I):
                      before = part[max(0, match.start() - 12) : match.start()]
                      after = part[match.end() : match.end() + 12]
                      if not re.search(r"目标|计划|拟|希望|备考|未达|未过|未通过|要求", before) and not re.match(r"\s*(?:未通过|备考|学习中|课程|培训)", after):
                          return True
              return False


          def _de_language(text: str, tags: dict) -> tuple[int, str]:
              if _german_b1_met(text):
                  return 15, "德语达到B1或以上"
              if _has_any(text, ("A2", "A1", "学习中")):
                  return 8, "德语还在A1、A2或学习中，未到B1"
              tag = _tag_points(tags, ("德语潜力", "语言学习力", "语言达标"), 15)
              if "零基础" in text:
                  lifted = min(max(4 if _has_any(text, ("学习意愿", "愿意", "潜力")) else 2, tag), 8)
                  return lifted, "德语零基础，学习潜力有限" if lifted <= 4 else "德语零基础，但有学习潜力"
              if tag:
                  return min(tag, 12), "有德语学习潜力，材料没写已考等级"
              if "德语" in text:
                  return 4, "提到德语，但没有等级"
              return 0, ""


          def _german_programs(text: str) -> list[str]:
              """专业名用《全专业方向名录》里的中文名，更具体的词先匹配。"""
              mapping = (
                  (("老年", "康养", "养老"), "老年康养与康复治疗"),
                  (("护理", "护士"), "综合护理与健康管理"),
                  (("网络安全", "系统集成"), "IT系统集成与网络安全"),
                  (("计算机", "软件", "编程", "信息技术"), "应用软件开发"),
                  (("数控", "精密加工", "模具"), "精密加工与数控技术"),
                  (("电动汽车", "高压系统", "新能源"), "电动汽车与高压系统"),
                  (("车身",), "车身与车辆制造技术"),
                  (("汽车", "汽修"), "汽车机电一体化（乘用车）"),
                  (("焊接",), "金属构造与焊接技术"),
                  (("暖通", "楼宇"), "建筑设备与能源技术"),
                  (("建筑", "施工"), "建筑工程与项目管理"),
                  (("航空",), "航空地勤与物流管理"),
                  (("酒店", "餐饮"), "酒店与餐饮管理"),
                  (("自动化", "机器人"), "自动化技术"),
                  (("工业机械",), "工业机械师"),
                  (("机电", "机械"), "机电一体化技术"),
              )
              return _unique([program for words, program in mapping if any(word in text for word in words)])


          _INPUT_FIELDS = (
              ("age", "年龄"),
              ("education", "学历"),
              ("language_ability", "语言能力"),
              ("core_demand", "核心诉求"),
              ("annual_income_range", "年收入"),
              ("target_project", "目标项目"),
              ("tag_weight", "标签"),
          )


          def _decide(fields: dict, text: str, singapore: dict, germany: dict) -> dict:
              """选出一条产品线，并分开写匹配、待补和下一阶段。"""
              singapore_view = _singapore_view(fields, text, singapore)
              germany_view = _germany_view(fields, text, germany)
              ranked = sorted(
                  (singapore_view, germany_view),
                  key=lambda item: ({"exact": 2, "partial": 1, "none": 0}[item["level"]], item["score"]),
                  reverse=True,
              )
              best, other = ranked
              named = _named_product(fields)
              if named == SINGAPORE and singapore_view["level"] != "none":
                  best, other = singapore_view, germany_view
              elif named == GERMANY and germany_view["level"] != "none":
                  best, other = germany_view, singapore_view
              missing_fields = [label for key, label in _INPUT_FIELDS if not fields.get(key)]
              if best["level"] == "none":
                  result = "not_matched"
                  product = None
                  programs: list[str] = []
              elif best["next_stage_reached"]:
                  result = "matched"
                  product = best["product"]
                  programs = list(best["programs"])
              else:
                  result = "partial"
                  product = best["product"]
                  programs = list(best["programs"])
              advice = _advisor_advice(best, other, fields, missing_fields)
              return {
                  "match_result": result,
                  "matched_product": product,
                  "match_score": best["score"],
                  "match_reason": advice["match_reason"],
                  "recommended_programs": programs,
                  "missing_fields": missing_fields,
                  "gaps": list(best["gaps"]),
                  "next_stage": best["next_stage"],
                  "next_stage_reached": best["next_stage_reached"],
                  "conclusion": advice["conclusion"],
                  "missing_materials": advice["missing_materials"],
                  "talk_points": advice["talk_points"],
                  "rule_brief": advice["rule_brief"],
                  "retrieval_query": advice["retrieval_query"],
              }


          def _singapore_view(fields: dict, text: str, scored: dict) -> dict:
              band = scored.get("band") or 0
              programs = list(scored.get("programs") or [])
              if not programs or band < 16:
                  level = "none"
              elif band == 40 and not scored.get("needs_age"):
                  level = "exact"
              else:
                  level = "partial"
              gaps: list[str] = []
              notes: list[str] = []
              if level != "none":
                  if not fields.get("education"):
                      gaps.append("学历")
                  if scored.get("needs_age") and not isinstance(fields.get("age"), int):
                      gaps.append("年龄")
                  if not _motives(_motive_text(fields, text)) & {"升学", "就业"}:
                      gaps.append("升学或就业需求")
                  if scored.get("kind") != "就业" and _income_low(fields) is None:
                      gaps.append("年收入")
                  if not fields.get("language_ability") and not _has_any(text, ("英语", "雅思", "四级", "六级")):
                      gaps.append("英语水平")
                  elif _has_any(text, ("薄弱", "基础差", "偏下", "零基础")):
                      notes.append("英语基础偏弱，只说明可以参加入学测试，不写成已经通过")
                  if level == "partial" and band not in {0} and "年龄" not in gaps:
                      if scored.get("needs_age") and isinstance(fields.get("age"), int):
                          gaps.append("年龄和该项目档位不完全一致")
                      elif not scored.get("needs_age"):
                          gaps.append("学历和该项目的原档不完全一致")
              reached = level == "exact" and not gaps
              stage = "未进入办理阶段" if level == "none" else "入学测试（英语笔试、心理测评和面试）"
              return {
                  "product": SINGAPORE,
                  "level": level,
                  "score": scored.get("score") or 0,
                  "programs": programs if level != "none" else [],
                  "basis": [note for note, points in scored.get("parts") or [] if points],
                  "gaps": gaps if level != "none" else ["年龄或学历没有对上新加坡项目档位"],
                  "notes": notes,
                  "next_stage": stage,
                  "next_stage_reached": reached,
              }


          def _germany_view(fields: dict, text: str, scored: dict) -> dict:
              education = fields.get("education") or ""
              fit = _age_fit(fields.get("age") if isinstance(fields.get("age"), int) else None, 18, 35)
              qualified = _has_any(education, ("高中", "高二", "高三", "中职", "中专", "职高", "技校", "中技", "专科", "大专", "本科"))
              if fit == "exact" and qualified:
                  level = "exact"
              elif (qualified and fit in {"missing", "near"}) or (fit == "exact" and not education):
                  level = "partial"
              else:
                  level = "none"
              programs = list(scored.get("programs") or [])
              gaps: list[str] = []
              notes: list[str] = []
              if level != "none":
                  if not education:
                      gaps.append("学历")
                  if not isinstance(fields.get("age"), int):
                      gaps.append("年龄")
                  elif fit != "exact":
                      gaps.append("年龄不在18到35岁")
                  if not _motives(_motive_text(fields, text)):
                      gaps.append("就业、升学或移民诉求")
                  if not programs:
                      gaps.append("专业方向")
                  if not _german_b1_met(text):
                      gaps.append("德语B1")
                  if not _has_any(text, ("动手", "实践", "逻辑")) and _tag_points(_tags(fields), ("动手能力",), 15) < 10:
                      notes.append("材料未写动手能力或逻辑思维，不把它当成已经符合")
                  if not fields.get("annual_income_range"):
                      notes.append("年收入未提供。德国项目可以贷款，不因此否决")
              reached = level == "exact" and not gaps
              if level == "none":
                  stage = "未进入办理阶段"
              elif reached:
                  stage = "赴德匹配企业"
              else:
                  stage = "赴德匹配企业（待补齐所列条件）"
              return {
                  "product": GERMANY,
                  "level": level,
                  "score": scored.get("score") or 0,
                  "programs": programs if level != "none" else [],
                  "basis": [note for note, points in scored.get("parts") or [] if points],
                  "gaps": gaps if level != "none" else ["年龄或学历没有达到德国项目的高中及以上、18到35岁"],
                  "notes": notes,
                  "next_stage": stage,
                  "next_stage_reached": reached,
              }


          def _named_product(fields: dict) -> str | None:
              target = fields.get("target_project") or ""
              if _has_any(target, ("德国", "中德", "双元")):
                  return GERMANY
              if _has_any(target, ("新加坡", "2+2", "6+6", "9+6", "0.5", "专升本", "本升硕")):
                  return SINGAPORE
              return None


          _MATERIAL_BY_GAP = {
              "学历": "学历或在读说明",
              "年龄": "年龄",
              "升学或就业需求": "这次是想升学还是就业",
              "年收入": "家庭大致预算",
              "英语水平": "英语水平说明，入学有英语笔试和口语面试",
              "就业、升学或移民诉求": "更看重就业、升学还是移民",
              "专业方向": "想读的专业方向",
              "德语B1": "德语B1证明，匹配企业前需要",
          }


          def _advisor_advice(best: dict, other: dict, fields: dict, missing_fields: list[str]) -> dict:
              """给顾问的沟通参考，不代替后续办理。"""
              materials = _missing_materials(best, missing_fields)
              conclusion = _conclusion(best, fields, materials)
              basis = _basis_sentence(best, other, conclusion)
              talk = _talk_points(conclusion, best, materials)
              material_text = "、".join(materials) if materials else "没有发现还缺的关键资料"
              reason = (
                  f"结论：{conclusion}。"
                  f"沟通时可以这样说：{basis}"
                  f"还缺这些资料：{material_text}。"
                  f"下一步先问：{talk}"
              )
              programs = "、".join(best["programs"]) if best["programs"] else "未点名专业"
              product = best["product"] if best["level"] != "none" else "没有对上的产品线"
              summary = str(fields.get("profile_summary") or "").strip()
              retrieval_query = " ".join(
                  bit for bit in (
                      str(fields.get("target_project") or ""),
                      product,
                      str(fields.get("education") or ""),
                      str(fields.get("core_demand") or ""),
                      str(fields.get("language_ability") or ""),
                      programs,
                      material_text,
                      summary[:120],
                  ) if bit
              )
              rule_brief = f"结论：{conclusion}。产品：{product}。方向：{programs}。核对依据：{basis}还缺：{material_text}。"
              return {
                  "conclusion": conclusion,
                  "missing_materials": material_text,
                  "talk_points": talk,
                  "match_reason": reason,
                  "rule_brief": rule_brief,
                  "retrieval_query": retrieval_query or "用户画像研判规则",
              }


          def _missing_materials(best: dict, missing_fields: list[str]) -> list[str]:
              materials = [_MATERIAL_BY_GAP[gap] for gap in best["gaps"] if gap in _MATERIAL_BY_GAP]
              if best["level"] == "none" and not materials:
                  materials.append("符合项目档位的年龄和学历说明")
              covered = set(materials)
              extras = {
                  "语言能力": "语言能力说明",
                  "核心诉求": "升学、就业或移民诉求",
                  "目标项目": "想了解的项目",
              }
              for label in missing_fields:
                  extra = extras.get(label)
                  if extra and extra not in covered and label not in {"年龄", "学历", "年收入"}:
                      materials.append(extra)
                      covered.add(extra)
              return _unique(materials)


          def _conclusion(best: dict, fields: dict, materials: list[str]) -> str:
              named = _named_product(fields)
              direction_gap = any("不完全一致" in gap or gap.startswith("年龄不在") for gap in best["gaps"])
              switched = bool(named and named != best["product"] and best["level"] != "none")
              if best["level"] == "none":
                  return "暂不推进"
              if materials:
                  return "需要补充信息"
              if switched or direction_gap:
                  return "建议调整方向"
              if best["next_stage_reached"]:
                  return "可以推进"
              return "需要补充信息"


          def _basis_sentence(best: dict, other: dict, conclusion: str) -> str:
              if best["level"] == "none":
                  reason = "；".join(best["gaps"]) if best["gaps"] else "年龄或学历没有对上现有项目"
                  return f"按现有材料，{reason}，先不建议推进。评分{best['score']}分，属于{_band_label(best['score'])}。"
              programs = "、".join(best["programs"]) if best["programs"] else "具体专业还没写明"
              basis = "；".join(best["basis"]) if best["basis"] else "现有材料只够判断产品线"
              sentence = f"更贴近{best['product']}，可谈的方向是{programs}。依据是：{basis}。"
              if best["notes"]:
                  sentence += "另外注意：" + "；".join(best["notes"]) + "。"
              if other["level"] != "none" and other["product"] != best["product"]:
                  sentence += f"{other['product']}也有部分对应，这次先按更贴近的一条沟通。"
              if conclusion == "可以推进":
                  sentence += f"关键条件已经齐，下一步可以谈到{best['next_stage']}。"
              sentence += f"评分{best['score']}分，属于{_band_label(best['score'])}。"
              return sentence


          def _talk_points(conclusion: str, best: dict, materials: list[str]) -> str:
              if conclusion == "暂不推进":
                  return "先说明目前差在年龄或学历，不把客户推进到入学测试或企业匹配；条件变化后再联系。"
              if conclusion == "需要补充信息":
                  ask = "、".join(materials) if materials else "还没写清的关键情况"
                  return f"先把{ask}问清楚，补齐前不要说已经符合或可以报名。"
              if conclusion == "建议调整方向":
                  return f"先说明客户原来的方向和{best['product']}不完全一致，问是否愿意改看{best['product']}。"
              if best["product"] == SINGAPORE:
                  return "确认客户接受推荐项目后，说明下一步是入学测试，包含英语笔试、心理测评和面试。"
              return "确认专业方向后，说明德语已到B1，下一步可以谈匹配企业；收入不够不作为否决理由。"


          def _band_label(score: int) -> str:
              if score >= 80:
                  return "80–100 高度符合"
              if score >= 60:
                  return "60–79 基本符合"
              if score >= 45:
                  return "45–59 较符合但关键项不足"
              if score >= 25:
                  return "25–44 只符合少部分条件"
              return "0–24 不符合"


          def _unique(items: list[str]) -> list[str]:
              seen: list[str] = []
              for item in items:
                  if item not in seen:
                      seen.append(item)
              return seen


          def main(material: str):
              """Dify 代码节点入口。正文来自粘贴或上传文件抽出的文字。"""
              try:
                  judgment = judge_text(material or "")
              except ValueError as exc:
                  code = str(exc)
                  reason = "一份资料里有多位客户" if code == "multiple" else "没有可研判的正文"
                  return {
                      "customer_name": "",
                      "contact_info": "",
                      "match_result": "not_matched",
                      "matched_product": "",
                      "match_score": 0,
                      "match_reason": f"结论：暂不推进。沟通时可以这样说：{reason}。还缺这些资料：一份只包含一位客户的完整正文。下一步先问：请客户单独提供年龄、学历、诉求和目标项目。",
                      "recommended_programs": [],
