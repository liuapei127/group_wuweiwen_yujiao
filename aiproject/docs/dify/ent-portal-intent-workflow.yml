{
  "app": {
    "name": "ENT门户-参数理解",
    "mode": "workflow",
    "icon": "🤖",
    "icon_background": "#DFF4EE",
    "description": "私有服务端意图提取，业务权限、确认和执行在ENT后端。"
  },
  "kind": "app",
  "version": "0.3.1",
  "dependencies": [],
  "workflow": {
    "graph": {
      "nodes": [
        {
          "id": "start",
          "type": "custom",
          "position": {
            "x": 0,
            "y": 200
          },
          "data": {
            "type": "start",
            "title": "门户输入",
            "variables": [
              {
                "variable": "query",
                "label": "query",
                "type": "paragraph",
                "required": true,
                "max_length": 8000
              },
              {
                "variable": "pending",
                "label": "pending",
                "type": "paragraph",
                "required": false,
                "max_length": 32000
              }
            ]
          }
        },
        {
          "id": "llm",
          "type": "custom",
          "position": {
            "x": 350,
            "y": 200
          },
          "data": {
            "type": "llm",
            "title": "只抽取业务动作和字段",
            "model": {
              "provider": "langgenius/tongyi/tongyi",
              "name": "qwen3.8-max",
              "mode": "chat",
              "completion_params": {
                "temperature": 0.3
              }
            },
            "prompt_template": [
              {
                "id": "portal-system",
                "role": "system",
                "text": "你是ENT业务参数抽取器。只输出一个JSON对象：{\"intent\":\"动作名\",\"params\":{}}。不输出解释、SQL、成功话术或Markdown。\n只从用户明确输入和下方同一待处理状态抽取事实，不编造姓名、编号、联系方式、版本或考试标识。缺字段保持缺失。\n禁止输出owner_employee_id、approver_id、recorded_by或操作者employee_id；colleague_contact中的employee_id仅是查询对象编号。\n用户否定、只咨询或要求删除数据时intent=other。确认、取消由服务端处理，模型不得自行确认。\n用户补字段时，仅合并同一待处理动作的已知字段。只有姓名没有lead_id时保留customer_name，不能猜编号。\n客户状态仅new/contacting/qualified/signed/lost；跟进类型phone/wechat/meeting/email/other。\n日报key_progress和risks是字符串数组，next_plan和content为字符串；report_date格式YYYY-MM-DD。\n成绩score为十进制数字或数字字符串；更正必须有expected_version，未知版本先留空。\n工单状态pending→processing→resolved→closed，更正状态不得臆造expected_status；解决/关闭需要solution。\n待办状态pending/in_progress/done/cancelled；创建时不需expected_status，更新时必须有expected_status。\n请假decision仅approved/rejected。日期时间不带时区。\n白名单查询nl_query的params为{\"intent\":\"白名单名\",\"params\":{}}，白名单仅：\nleads_by_status(status)、lead_detail_by_name(customer_name)、lead_follow_ups_by_name(customer_name)、pending_leaves(空对象)、daily_reports_recent(空对象)。\n不要把普通业务查询全部变成nl_query；只有查询跟进或用户明确指定时用此动作。客户列表用lead_list，近期本人日报用daily_list。\n动作目录（method,path,required,allowed）：\n{\"lead_create\": [\"post\", \"/api/v1/consultant/leads\", \"customer_name\", \"customer_name contact_info gender age education_level intended_country intended_major background_info source_channel remark\"], \"lead_list\": [\"get\", \"/api/v1/consultant/leads\", \"\", \"keyword status page page_size\"], \"lead_detail\": [\"get\", \"/api/v1/consultant/leads/{lead_id}\", \"lead_id\", \"lead_id customer_name\"], \"lead_update\": [\"patch\", \"/api/v1/consultant/leads/{lead_id}\", \"lead_id\", \"lead_id customer_name contact_info intended_country intended_major background_info remark\"], \"lead_status\": [\"patch\", \"/api/v1/consultant/leads/{lead_id}/status\", \"lead_id status\", \"lead_id customer_name status lost_reason\"], \"lead_follow_up\": [\"post\", \"/api/v1/consultant/leads/{lead_id}/follow-ups\", \"lead_id content\", \"lead_id customer_name content follow_type next_plan\"], \"daily_submit\": [\"post\", \"/api/v1/employee-reports\", \"content\", \"content report_date raw_content key_progress risks next_plan\"], \"daily_list\": [\"get\", \"/api/v1/employee-reports\", \"\", \"date_from date_to\"], \"organizations\": [\"get\", \"/api/v1/enterprise/organizations\", \"\", \"keyword limit\"], \"colleagues\": [\"get\", \"/api/v1/enterprise/organizations/colleagues\", \"name\", \"name\"], \"colleague_contact\": [\"get\", \"/api/v1/enterprise/colleagues/{employee_id}/contact\", \"employee_id\", \"employee_id\"], \"guides\": [\"get\", \"/api/v1/enterprise/onboarding-guides\", \"\", \"keyword category page page_size\"], \"guide_create\": [\"post\", \"/api/v1/enterprise/onboarding-guides\", \"title category content\", \"title category content\"], \"score_create\": [\"post\", \"/api/v1/enterprise/scores\", \"student_id course_name score\", \"student_id course_name score semester credit exam_key submission_key\"], \"scores\": [\"get\", \"/api/v1/enterprise/scores\", \"student_id\", \"student_id semester limit\"], \"score_correct\": [\"put\", \"/api/v1/enterprise/scores/{score_id}\", \"score_id student_id course_name score expected_version\", \"score_id student_id course_name score semester credit expected_version correction_reason\"], \"score_history\": [\"get\", \"/api/v1/enterprise/scores/{score_id}/history\", \"score_id\", \"score_id limit\"], \"leaves\": [\"get\", \"/api/v1/student-admin/leaves/pending\", \"\", \"\"], \"leave_approve\": [\"post\", \"/api/v1/student-admin/leaves/{leave_id}/approve\", \"leave_id decision\", \"leave_id decision approval_comment\"], \"tickets\": [\"get\", \"/api/v1/enterprise/tickets\", \"\", \"status limit\"], \"ticket_detail\": [\"get\", \"/api/v1/enterprise/tickets/{ticket_id}\", \"ticket_id\", \"ticket_id\"], \"ticket_update\": [\"patch\", \"/api/v1/enterprise/tickets/{ticket_id}\", \"ticket_id expected_status status\", \"ticket_id expected_status status solution\"], \"todos\": [\"get\", \"/api/v1/enterprise/todos\", \"\", \"due_only limit\"], \"todo_create\": [\"post\", \"/api/v1/enterprise/todos\", \"title\", \"title description due_time priority\"], \"todo_update\": [\"patch\", \"/api/v1/enterprise/todos/{todo_id}\", \"todo_id expected_status status\", \"todo_id expected_status status\"], \"notifications\": [\"get\", \"/api/v1/enterprise/notifications\", \"\", \"limit\"], \"nl_query\": [\"post\", \"/api/v1/ai/nl2sql/query\", \"intent params\", \"intent params\"]}\n服务端待处理状态：{{#start.pending#}}"
              },
              {
                "id": "portal-user",
                "role": "user",
                "text": "{{#start.query#}}"
              }
            ],
            "context": {
              "enabled": false,
              "variable_selector": []
            },
            "vision": {
              "enabled": false
            }
          }
        },
        {
          "id": "end",
          "type": "custom",
          "position": {
            "x": 700,
            "y": 200
          },
          "data": {
            "type": "end",
            "title": "返回参数给可信后端",
            "outputs": [
              {
                "variable": "text",
                "value_selector": [
                  "llm",
                  "text"
                ],
                "value_type": "string"
              }
            ]
          }
        }
      ],
      "edges": [
        {
          "id": "start-llm",
          "source": "start",
          "target": "llm",
          "sourceHandle": "source",
          "targetHandle": "target",
          "type": "custom",
          "data": {
            "sourceType": "start",
            "targetType": "llm",
            "isInIteration": false,
            "isInLoop": false
          }
        },
        {
          "id": "llm-end",
          "source": "llm",
          "target": "end",
          "sourceHandle": "source",
          "targetHandle": "target",
          "type": "custom",
          "data": {
            "sourceType": "llm",
            "targetType": "end",
            "isInIteration": false,
            "isInLoop": false
          }
        }
      ],
      "viewport": {
        "x": 0,
        "y": 0,
        "zoom": 0.8
      }
    },
    "features": {},
    "environment_variables": [],
    "conversation_variables": []
  }
}